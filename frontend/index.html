<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body class="text-gray-100 flex h-screen overflow-hidden">

    <!-- Collapsible Sidebar -->
    <aside id="sidebar" class="glass-panel border-r border-white/5 flex flex-col justify-between transition-all duration-300 w-64 flex-shrink-0 z-30">
        <div class="p-4 space-y-6">
            <!-- Sidebar Header & Toggle -->
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5 overflow-hidden sidebar-text">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white flex-shrink-0">
                        MT
                    </div>
                    <span class="font-bold text-sm tracking-wide truncate">Media Tools</span>
                </div>
                <button id="sidebar-toggle" class="p-1.5 rounded-lg hover:bg-white/5 text-gray-400 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <!-- Features Navigation -->
            <nav class="space-y-1">
                <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 font-medium text-sm transition">
                    <svg class="w-5 h-5 flex-shrink-0 text-indigo-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <span class="sidebar-text truncate">YouTube Downloader</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer Status -->
        <div class="p-4 border-t border-white/5">
            <div class="flex items-center space-x-2">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span id="status-text" class="text-xs text-gray-400 sidebar-text">Connected</span>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        <!-- Top bar mobile toggle -->
        <header class="p-4 md:hidden flex items-center justify-between border-b border-white/5">
            <button id="mobile-sidebar-toggle" class="p-2 rounded-lg bg-slate-800 text-gray-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="font-bold text-sm">YouTube Downloader</span>
            <div class="w-8"></div>
        </header>

        <main class="max-w-3xl mx-auto w-full p-4 md:p-8 space-y-6 flex-grow">
            <!-- Input Box -->
            <section class="glass-panel p-6 rounded-2xl shadow-xl">
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-grow">
                        <input 
                            type="text" 
                            id="youtube-url" 
                            placeholder="Dán link YouTube tại đây..." 
                            class="w-full pl-4 pr-24 py-3 rounded-xl glass-input text-sm text-white placeholder-gray-500 outline-none"
                        />
                        <button 
                            id="paste-btn" 
                            type="button" 
                            class="absolute right-2 top-2 px-3 py-1 rounded-lg bg-slate-700/70 hover:bg-slate-600 text-xs text-gray-300 transition"
                        >
                            Dán
                        </button>
                    </div>

                    <button 
                        id="extract-btn" 
                        type="button" 
                        class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition flex items-center justify-center space-x-2 flex-shrink-0"
                    >
                        <svg class="w-4 h-4 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <span id="extract-btn-text">Lấy Thông Tin</span>
                    </button>
                </div>
            </section>

            <!-- Result Card -->
            <section id="result-card" class="glass-panel p-6 rounded-2xl shadow-xl space-y-4 hidden border-indigo-500/20">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4">
                    <img 
                        id="video-thumb" 
                        src="" 
                        alt="Thumbnail" 
                        class="w-full sm:w-40 h-24 object-cover rounded-xl border border-white/10"
                    />
                    <div class="flex-grow space-y-1 text-center sm:text-left overflow-hidden w-full">
                        <h3 id="video-title" class="text-base font-bold text-white truncate"></h3>
                        <div class="flex items-center justify-center sm:justify-start gap-2 text-xs text-gray-400">
                            <span id="video-uploader" class="truncate"></span>
                            <span>•</span>
                            <span id="video-duration"></span>
                        </div>
                    </div>
                </div>

                <!-- Audio Player -->
                <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-xl space-y-2">
                    <audio id="audio-element" preload="none"></audio>
                    <div class="space-y-1">
                        <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-400 font-mono">
                            <span id="current-time">00:00</span>
                            <span id="total-time">00:00</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <button 
                            id="play-pause-btn" 
                            class="w-9 h-9 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition"
                        >
                            <svg id="play-icon" class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                            </svg>
                            <svg id="pause-icon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" class="w-20 cursor-pointer">
                    </div>
                </div>

                <!-- Resolution & Format Selectors -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <!-- Video Resolution Select -->
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                            <span>Độ phân giải Video</span>
                            <span class="text-indigo-400 font-normal">Hỗ trợ tới 4K</span>
                        </label>
                        <select id="video-select" class="w-full p-2.5 rounded-xl glass-input text-xs text-white outline-none cursor-pointer">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <!-- Audio Format Select -->
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                            <span>Định dạng Audio</span>
                            <span class="text-emerald-400 font-normal">Bitrate cao</span>
                        </label>
                        <select id="audio-select" class="w-full p-2.5 rounded-xl glass-input text-xs text-white outline-none cursor-pointer">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>

                <!-- Live Download Progress Bar (Hidden initially) -->
                <div id="download-progress-container" class="space-y-1.5 hidden bg-slate-900/60 p-3 rounded-xl border border-white/5">
                    <div class="flex justify-between items-center text-xs">
                        <span id="download-progress-status" class="text-indigo-400 font-medium">Đang tải xuống...</span>
                        <span id="download-progress-percent" class="font-mono text-gray-200 font-bold">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div id="download-progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2 rounded-full transition-all duration-150 w-0"></div>
                    </div>
                    <div class="flex justify-between text-[11px] text-gray-400 font-mono">
                        <span id="download-progress-bytes">0 MB / 0 MB</span>
                        <span id="download-progress-speed"></span>
                    </div>
                </div>

                <!-- Action Buttons: Audio & Video -->
                <div class="flex flex-col sm:flex-row gap-2 pt-1">
                    <button 
                        id="download-video-btn" 
                        class="flex-1 py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs sm:text-sm transition flex items-center justify-center space-x-1.5"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        <span>Tải Video</span>
                    </button>

                    <button 
                        id="download-audio-btn" 
                        class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs sm:text-sm transition flex items-center justify-center space-x-1.5"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                        <span>Tải Audio</span>
                    </button>

                    <!-- Direct Max-Speed Download (IDM / Browser Native) -->
                    <button 
                        id="direct-fast-btn" 
                        class="py-2.5 px-3 rounded-xl bg-amber-600/90 hover:bg-amber-500 text-white font-medium text-xs sm:text-sm transition flex items-center justify-center space-x-1"
                        title="Tải cực tốc từ Google CDN (Max băng thông mạng 100MB/s)"
                    >
                        <svg class="w-4 h-4 text-amber-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span>Tải Cực Tốc</span>
                    </button>

                    <button 
                        id="copy-url-btn" 
                        class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-gray-300 font-medium text-xs sm:text-sm transition flex items-center justify-center space-x-1 flex-shrink-0"
                        title="Copy link stream"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    </button>
                </div>
            </section>

            <!-- Recent list -->
            <section class="glass-panel p-5 rounded-2xl space-y-3">
                <div class="flex items-center justify-between border-b border-white/5 pb-2">
                    <h3 class="font-medium text-xs text-gray-400 uppercase tracking-wider">Đã tải gần đây</h3>
                    <button id="clear-history-btn" class="text-xs text-gray-500 hover:text-red-400 transition">
                        Xoá
                    </button>
                </div>
                <div id="history-list" class="space-y-1.5"></div>
            </section>
        </main>
    </div>

    <!-- Toast -->
    <div 
        id="toast" 
        class="fixed bottom-5 right-5 z-50 flex items-center px-4 py-2.5 rounded-xl shadow-xl transition-all duration-300 transform translate-y-20 opacity-0 bg-slate-800 text-white border border-slate-700 text-sm"
    >
        <span id="toast-message"></span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
